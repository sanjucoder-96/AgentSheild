# Local development stack: gateway + three tool servers + attacker sink +
# Postgres + Redis. Plain HTTP, development secrets. NOT for a public server
# (use deploy/docker-compose.prod.yml for that).
#
#   docker compose up --build -d      build and start everything
#   open http://localhost:8080        login: admin / admin
#   docker compose down               stop (add -v to also wipe data)
#
# Optional: put MODEL_API_KEY=gsk_... in a .env file next to this one to
# enable the Groq features.

name: agentshield-dev

x-tool-env: &tool-env
  TOOL_HOST: 0.0.0.0
  TOOL_SHARED_SECRET: dev-tool-secret-change-me
  ATTACKER_URL: http://attacker:9999

services:
  gateway:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["8080:8080"]
    environment:
      GATEWAY_LISTEN: ":8080"
      GATEWAY_PROFILE: full
      GATEWAY_CONFIG: /app/config/gateway.docker.yaml
      GATEWAY_STATE_DIR: /app/state
      GATEWAY_JWT_SECRET: dev-jwt-secret-change-me
      ADMIN_TOKEN: dev-admin-token
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: dev-session-secret-change-me
      TOOL_SHARED_SECRET: dev-tool-secret-change-me
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-https://api.groq.com/openai/v1/chat/completions}
      MODEL_NAME: ${MODEL_NAME:-openai/gpt-oss-20b}
    volumes:
      - gateway-state:/app/state
      - gateway-results:/app/results
      - gateway-policies:/app/config/policies
    healthcheck:
      test: ["CMD", "/app/bin/gatewayctl", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      workspace: { condition: service_started }
      comms: { condition: service_started }
      crm: { condition: service_started }

  workspace:
    build: { context: ., dockerfile: tools/Dockerfile }
    image: agentshield-tools:dev
    command: ["python", "tools/workspace_server.py"]
    environment: { <<: *tool-env, TOOL_PORT: "8101" }
    ports: ["8101:8101"]          # exposed only so the demo's rug-pull step works from your laptop
  comms:
    image: agentshield-tools:dev
    command: ["python", "tools/comms_server.py"]
    environment: { <<: *tool-env, TOOL_PORT: "8102" }
    ports: ["8102:8102"]
    depends_on: [workspace]
  crm:
    image: agentshield-tools:dev
    command: ["python", "tools/crm_server.py"]
    environment: { <<: *tool-env, TOOL_PORT: "8103" }
    ports: ["8103:8103"]
    depends_on: [workspace]
  attacker:
    image: agentshield-tools:dev
    command: ["python", "attacker/attacker_server.py"]
    environment: { ATTACKER_HOST: 0.0.0.0 }
    ports: ["9999:9999"]          # http://localhost:9999 shows anything that leaked
    depends_on: [workspace]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  gateway-state:
  gateway-results:
  gateway-policies:
  pg-data:
